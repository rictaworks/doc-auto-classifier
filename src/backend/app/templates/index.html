<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書類自動分類ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .category-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 9999px; font-weight: 600; }
    .drop-zone { border: 2px dashed #94a3b8; transition: border-color 0.2s, background 0.2s; }
    .drop-zone.active { border-color: #3b82f6; background: #eff6ff; }
    #modal-backdrop { display: none; }
    #modal-backdrop.open { display: flex; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- ヘッダー -->
  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2 text-blue-600 font-bold text-lg">
        <i class="fa-solid fa-folder-open"></i>
        <span>書類自動分類ツール</span>
        <span class="text-xs text-gray-400 font-normal ml-2">Demo v1.0</span>
      </div>
      <button id="btn-upload-open"
        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
        <i class="fa-solid fa-upload"></i> アップロード
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-4">

    <!-- 検索・フィルタバー -->
    <div class="bg-white rounded-xl shadow-sm p-4 flex flex-wrap gap-3 items-end">
      <div class="flex-1 min-w-48">
        <label class="block text-xs font-semibold text-gray-500 mb-1">ファイル名で検索</label>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input id="search-query" type="text" placeholder="検索..."
            class="w-full border rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
      </div>
      <div class="min-w-40">
        <label class="block text-xs font-semibold text-gray-500 mb-1">カテゴリ</label>
        <select id="filter-category"
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="min-w-36">
        <label class="block text-xs font-semibold text-gray-500 mb-1">タグ</label>
        <input id="filter-tag" type="text" placeholder="タグ名..."
          class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button id="btn-search"
        class="bg-gray-700 hover:bg-gray-800 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
        <i class="fa-solid fa-filter"></i> 絞り込む
      </button>
      <button id="btn-reset"
        class="border border-gray-300 hover:bg-gray-100 text-gray-600 text-sm px-3 py-2 rounded-lg transition">
        <i class="fa-solid fa-rotate-left"></i> リセット
      </button>
    </div>

    <!-- ファイル一覧 -->
    <div class="bg-white rounded-xl shadow-sm">
      <div class="px-4 py-3 border-b flex items-center justify-between">
        <span class="font-semibold text-gray-700 text-sm">
          <i class="fa-solid fa-list text-blue-500 mr-1"></i>
          ファイル一覧
        </span>
        <span id="total-count" class="text-xs text-gray-400">0 件</span>
      </div>
      <div id="file-list" class="divide-y min-h-32">
        <div class="flex items-center justify-center py-16 text-gray-400 text-sm" id="empty-state">
          <i class="fa-solid fa-inbox mr-2 text-2xl"></i> ファイルがありません
        </div>
      </div>
      <div id="pagination" class="flex justify-center gap-2 py-4 border-t hidden"></div>
    </div>
  </main>

  <!-- アップロードモーダル -->
  <div id="modal-backdrop"
    class="fixed inset-0 bg-black/40 z-50 items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-gray-800 text-lg">
          <i class="fa-solid fa-upload text-blue-500 mr-2"></i>ファイルをアップロード
        </h2>
        <button id="btn-modal-close" class="text-gray-400 hover:text-gray-600 text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="upload-form" novalidate>
        <!-- ハニーポット（Bot対策・非表示） -->
        <input type="text" name="hp_field" value="" style="display:none" tabindex="-1" autocomplete="off">

        <div id="drop-zone"
          class="drop-zone rounded-xl p-8 text-center cursor-pointer hover:bg-blue-50 transition">
          <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-400 mb-3"></i>
          <p class="text-gray-600 text-sm mb-1">クリックまたはドラッグ&amp;ドロップ</p>
          <p class="text-gray-400 text-xs">PDF / TXT / MD / PNG / JPG (最大 10MB)</p>
          <input id="file-input" type="file"
            accept=".pdf,.txt,.md,.png,.jpg,.jpeg" class="hidden">
        </div>

        <div id="selected-file" class="hidden bg-gray-50 rounded-lg p-3 flex items-center gap-3 text-sm text-gray-700">
          <i class="fa-solid fa-file text-blue-400 text-xl"></i>
          <span id="selected-filename" class="flex-1 truncate"></span>
          <button type="button" id="btn-clear-file" class="text-gray-400 hover:text-red-400">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div id="upload-error" class="hidden text-red-600 text-sm bg-red-50 rounded-lg px-3 py-2"></div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btn-cancel"
            class="border border-gray-300 text-gray-600 text-sm px-4 py-2 rounded-lg hover:bg-gray-50 transition">
            キャンセル
          </button>
          <button type="submit" id="btn-submit"
            class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-lg transition flex items-center gap-2">
            <i class="fa-solid fa-upload"></i> アップロード
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- タグ追加モーダル -->
  <div id="tag-modal-backdrop"
    class="fixed inset-0 bg-black/40 z-50 items-center justify-center hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-gray-800 text-base">
          <i class="fa-solid fa-tag text-green-500 mr-2"></i>タグを追加
        </h2>
        <button id="btn-tag-modal-close" class="text-gray-400 hover:text-gray-600 text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <input id="tag-input" type="text" placeholder="タグ名を入力..."
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400">
      <div class="flex justify-end gap-2">
        <button id="btn-tag-cancel" class="border border-gray-300 text-gray-600 text-sm px-4 py-2 rounded-lg hover:bg-gray-50">
          キャンセル
        </button>
        <button id="btn-tag-submit" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-4 py-2 rounded-lg">
          追加
        </button>
      </div>
    </div>
  </div>

  <!-- プレビューモーダル -->
  <div id="preview-modal-backdrop"
    class="fixed inset-0 bg-black/40 z-50 items-center justify-center hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 p-6 space-y-3 max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between shrink-0">
        <h2 id="preview-title" class="font-bold text-gray-800 text-base truncate mr-4">
          <i class="fa-solid fa-eye text-purple-500 mr-2"></i>プレビュー
        </h2>
        <button id="btn-preview-close" class="text-gray-400 hover:text-gray-600 text-xl shrink-0">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <pre id="preview-content" class="flex-1 overflow-auto bg-gray-50 rounded-lg p-4 text-sm text-gray-700 whitespace-pre-wrap font-mono"></pre>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
